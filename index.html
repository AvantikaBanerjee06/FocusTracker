<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Timer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ── Default (cafe) token values ─────────────────────── */
    :root {
      --card-bg: #fdf6ec;
      --timer-color: #3e1f05;
      --title-color: #7a4f2d;
      --subtitle-color: #b58a60;
      --divider-color: #d4a574;
      --muted-color: #c4a07a;
      --btn-primary-bg: #7a4f2d;
      --btn-primary-text: #fdf6ec;
      --btn-primary-shadow: rgba(122, 79, 45, 0.4);
      --btn-primary-hover: #5e3a1e;
      --btn-secondary-bg: #e8d5bb;
      --btn-secondary-text: #7a4f2d;
      --btn-secondary-hover: #d9c0a0;
      --btn-ghost-text: #b58a60;
      --btn-ghost-border: #d4a574;
      --btn-ghost-hover-bg: #f5e9d8;
      --btn-ghost-hover-text: #7a4f2d;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Lato', sans-serif;
      position: relative;
      overflow: hidden;
    }

    /* Slow atmospheric drift on the glow layer */
    body::before {
      content: '';
      position: fixed;
      inset: -25%;
      pointer-events: none;
      z-index: 0;
      animation: drift 22s ease-in-out infinite alternate;
    }

    /* Film-grain noise overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    @keyframes drift {
      from { transform: translate(0,    0   ) scale(1);    }
      to   { transform: translate(2.5%, 1.5%) scale(1.05); }
    }

    /* ══════════════════════════════════════════════════════
       CAFE  — warm espresso, amber lamp-glow
    ══════════════════════════════════════════════════════ */
    body.theme-cafe {
      background-color: #1a0c04;
      background-image:
        radial-gradient(ellipse 80% 55% at 15% 15%, #4a2510 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 85% 85%, #3a1a08 0%, transparent 55%),
        radial-gradient(ellipse 70% 70% at 50% 50%, #2c1a0e 0%, transparent 80%);
    }
    body.theme-cafe::before {
      background-image:
        radial-gradient(ellipse 55% 40% at 28% 72%, rgba(190, 95, 20, 0.18) 0%, transparent 60%),
        radial-gradient(ellipse 45% 35% at 75% 18%, rgba(210, 115, 28, 0.13) 0%, transparent 60%);
    }

    /* ══════════════════════════════════════════════════════
       LIBRARY  — dark mahogany, single candlelight overhead
    ══════════════════════════════════════════════════════ */
    body.theme-library {
      background-color: #0d0902;
      background-image:
        radial-gradient(ellipse 65% 38% at 50% 3%, #3a2208 0%, transparent 55%),
        radial-gradient(ellipse 45% 65% at  8% 55%, #1e1406 0%, transparent 55%),
        radial-gradient(ellipse 45% 65% at 92% 55%, #1e1406 0%, transparent 55%),
        radial-gradient(ellipse 80% 35% at 50% 105%, #0d0902 0%, transparent 60%);
    }
    body.theme-library::before {
      background-image:
        radial-gradient(ellipse 28% 22% at 50% 1%, rgba(210, 155, 45, 0.28) 0%, transparent 60%),
        radial-gradient(ellipse 18% 14% at 37% 3%, rgba(230, 165, 45, 0.10) 0%, transparent 50%),
        radial-gradient(ellipse 18% 14% at 63% 3%, rgba(230, 165, 45, 0.10) 0%, transparent 50%);
    }
    .theme-library {
      --card-bg: #f5f0e4;
      --timer-color: #2c1a0a;
      --title-color: #6b4a1a;
      --subtitle-color: #9a7a3a;
      --divider-color: #c9a84c;
      --muted-color: #9a8050;
      --btn-primary-bg: #6b4a1a;
      --btn-primary-text: #f5f0e4;
      --btn-primary-shadow: rgba(107, 74, 26, 0.4);
      --btn-primary-hover: #4e3410;
      --btn-secondary-bg: #e0d0a8;
      --btn-secondary-text: #4e3410;
      --btn-secondary-hover: #d0bc90;
      --btn-ghost-text: #9a7a3a;
      --btn-ghost-border: #c9a84c;
      --btn-ghost-hover-bg: #ede5c8;
      --btn-ghost-hover-text: #6b4a1a;
    }

    /* ══════════════════════════════════════════════════════
       FOREST  — deep canopy, light shafts from above
    ══════════════════════════════════════════════════════ */
    body.theme-forest {
      background-color: #051005;
      background-image:
        radial-gradient(ellipse 95% 45% at 50% -5%, #1e4d1a 0%, transparent 55%),
        radial-gradient(ellipse 45% 60% at  4% 60%, #11300d 0%, transparent 50%),
        radial-gradient(ellipse 45% 60% at 96% 60%, #11300d 0%, transparent 50%),
        radial-gradient(ellipse 60% 35% at 50% 105%, #08180607 0%, transparent 60%);
    }
    body.theme-forest::before {
      background-image:
        radial-gradient(ellipse 18% 55% at 42% 0%,  rgba(110, 190, 85,  0.18) 0%, transparent 70%),
        radial-gradient(ellipse 12% 40% at 58% 0%,  rgba(95,  175, 70,  0.12) 0%, transparent 65%),
        radial-gradient(ellipse 20% 35% at 25% 12%, rgba(80,  160, 60,  0.09) 0%, transparent 60%),
        radial-gradient(ellipse 20% 35% at 78% 8%,  rgba(80,  160, 60,  0.07) 0%, transparent 60%);
    }
    .theme-forest {
      --card-bg: #f2f9f2;
      --timer-color: #1a3d20;
      --title-color: #3a7a48;
      --subtitle-color: #60a070;
      --divider-color: #88c898;
      --muted-color: #72a882;
      --btn-primary-bg: #3a7a48;
      --btn-primary-text: #f2f9f2;
      --btn-primary-shadow: rgba(58, 122, 72, 0.4);
      --btn-primary-hover: #2a5c35;
      --btn-secondary-bg: #c4e8ca;
      --btn-secondary-text: #2a5c35;
      --btn-secondary-hover: #b0d8b6;
      --btn-ghost-text: #60a070;
      --btn-ghost-border: #88c898;
      --btn-ghost-hover-bg: #dcf0de;
      --btn-ghost-hover-text: #3a7a48;
    }

    /* ══════════════════════════════════════════════════════
       OCEAN  — midnight deep-sea, light shimmer at surface
    ══════════════════════════════════════════════════════ */
    body.theme-ocean {
      background-color: #03080f;
      background-image:
        radial-gradient(ellipse 100% 38% at 50% 0%,  #0e3d5e 0%, transparent 55%),
        radial-gradient(ellipse  55% 55% at 12% 50%, #061c30 0%, transparent 55%),
        radial-gradient(ellipse  55% 55% at 88% 50%, #061c30 0%, transparent 55%),
        radial-gradient(ellipse  80% 35% at 50% 105%, #03080f 0%, transparent 60%);
    }
    body.theme-ocean::before {
      background-image:
        radial-gradient(ellipse 90% 25% at 50% 0%, rgba(30, 145, 205, 0.22) 0%, transparent 55%),
        radial-gradient(ellipse 40% 15% at 28% 3%, rgba(55, 185, 230, 0.10) 0%, transparent 50%),
        radial-gradient(ellipse 35% 12% at 72% 2%, rgba(55, 185, 230, 0.08) 0%, transparent 50%);
    }
    .theme-ocean {
      --card-bg: #edf5ff;
      --timer-color: #0a1e40;
      --title-color: #1a5e8a;
      --subtitle-color: #4080a8;
      --divider-color: #72c0dc;
      --muted-color: #60a8c4;
      --btn-primary-bg: #1a5e8a;
      --btn-primary-text: #edf5ff;
      --btn-primary-shadow: rgba(26, 94, 138, 0.4);
      --btn-primary-hover: #0e4068;
      --btn-secondary-bg: #bcdcf0;
      --btn-secondary-text: #0e4068;
      --btn-secondary-hover: #a4cce4;
      --btn-ghost-text: #4080a8;
      --btn-ghost-border: #72c0dc;
      --btn-ghost-hover-bg: #d8ecf8;
      --btn-ghost-hover-text: #1a5e8a;
    }

    /* ── Card ─────────────────────────────────────────────── */
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 52px 64px 44px;
      text-align: center;
      box-shadow:
        0 16px 70px rgba(0, 0, 0, 0.6),
        0  4px 18px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.65);
      max-width: 380px;
      width: 90%;
      position: relative;
      z-index: 2;
      transition:
        background-color 0.55s ease,
        box-shadow       0.55s ease;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--title-color);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 8px;
      transition: color 0.55s ease;
    }

    .subtitle {
      font-size: 0.78rem;
      color: var(--subtitle-color);
      letter-spacing: 0.08em;
      margin-bottom: 36px;
      min-height: 1.1em;
      transition: color 0.55s ease, opacity 0.25s ease;
    }
    .subtitle.fading { opacity: 0; }

    .divider {
      width: 36px;
      height: 2px;
      background: var(--divider-color);
      margin: 0 auto 32px;
      border-radius: 2px;
      transition: background-color 0.55s ease;
    }

    #timer {
      font-family: 'Playfair Display', serif;
      font-size: 5.5rem;
      font-weight: 700;
      color: var(--timer-color);
      letter-spacing: 0.04em;
      line-height: 1;
      margin-bottom: 40px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: color 0.55s ease;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      font-family: 'Lato', sans-serif;
      font-size: 0.76rem;
      font-weight: 400;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      border: none;
      border-radius: 50px;
      padding: 12px 26px;
      cursor: pointer;
      transition:
        background  0.2s ease,
        color       0.2s ease,
        box-shadow  0.2s ease,
        border-color 0.2s ease,
        transform   0.1s ease;
    }
    button:active { transform: scale(0.96); }

    #startBtn {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      box-shadow: 0 3px 14px var(--btn-primary-shadow);
    }
    #startBtn:hover {
      background: var(--btn-primary-hover);
      box-shadow: 0 4px 18px var(--btn-primary-shadow);
    }

    #stopBtn {
      background: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
    }
    #stopBtn:hover { background: var(--btn-secondary-hover); }

    #resetBtn {
      background: transparent;
      color: var(--btn-ghost-text);
      border: 1.5px solid var(--btn-ghost-border);
    }
    #resetBtn:hover {
      background: var(--btn-ghost-hover-bg);
      color: var(--btn-ghost-hover-text);
    }

    /* ── Mode label ──────────────────────────────────────── */
    .mode-label {
      font-size: 0.66rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted-color);
      margin-bottom: 14px;
      transition: color 0.55s ease, opacity 0.2s ease;
    }
    .mode-label.fading { opacity: 0; }

    /* ── Pomodoro progress dots ───────────────────────────── */
    .pomodoro-dots {
      display: flex;
      gap: 9px;
      justify-content: center;
      margin-top: 28px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--divider-color);
      opacity: 0.3;
      transition: background 0.4s ease, opacity 0.4s ease, transform 0.2s ease;
    }
    .dot.filled {
      background: var(--btn-primary-bg);
      opacity: 1;
    }
    .dot.pulse {
      transform: scale(1.5);
    }

    /* ── Mute button ─────────────────────────────────────── */
    .mute-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.05rem;
      line-height: 1;
      padding: 4px 6px;
      cursor: pointer;
      opacity: 0.35;
      transition: opacity 0.2s ease;
      border-radius: 6px;
    }
    .mute-btn:hover  { opacity: 0.75; }
    .mute-btn:active { transform: scale(0.9); }

    /* ── Theme switcher ───────────────────────────────────── */
    .theme-switcher {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 31;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 7px 10px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .theme-btn {
      font-family: 'Lato', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 7px 16px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      background: transparent;
      color: rgba(255, 255, 255, 0.5);
      transition: background 0.2s ease, color 0.2s ease, transform 0.12s ease;
    }
    .theme-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.85);
    }
    .theme-btn.active {
      background: rgba(255, 255, 255, 0.22);
      color: rgba(255, 255, 255, 0.95);
    }
    .theme-btn:active { transform: scale(0.94); }

    /* ── Nav bar ─────────────────────────────────────────────── */
    .nav-bar {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      z-index: 30;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 8px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.09);
    }

    .nav-btn {
      font-family: 'Lato', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 8px 22px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      background: transparent;
      color: rgba(255, 255, 255, 0.45);
      transition: background 0.2s, color 0.2s;
    }

    .nav-btn:hover  { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.82); }
    .nav-btn.active { background: rgba(255,255,255,0.2);  color: rgba(255,255,255,0.95); }

    /* ── Shared overlay panel ───────────────────────────────────── */
    .panel {
      position: fixed;
      inset: 0;
      overflow-y: auto;
      z-index: 20;
      display: none;
      padding: 80px 20px 52px;
    }
    .panel.open { display: block; }

    .dash-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      max-width: 860px;
      margin: 0 auto;
    }

    @media (max-width: 620px) { .dash-grid { grid-template-columns: 1fr; } }

    .dash-full { grid-column: 1 / -1; }

    .dash-card {
      background: rgba(8, 8, 8, 0.58);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 22px 22px 18px;
    }

    .dash-title {
      font-family: 'Playfair Display', serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.28);
      margin-bottom: 16px;
    }

    .chart-wrap { position: relative; }

    /* ── Focus vs Distraction card ───────────────────────────── */
    .stat-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .stat-block { flex: 1; }

    .stat-val {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1;
      color: #fff;
    }

    .stat-lbl {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.28);
      margin-top: 5px;
    }

    .split-track {
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.07);
      overflow: hidden;
    }

    .split-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #22c55e 0%, #6366f1 100%);
      transition: width 0.7s ease;
      width: 0%;
    }

    /* ── Home view ───────────────────────────────────────────── */
    .home-wrap {
      max-width: 460px;
      margin: 0 auto;
      padding-top: 12px;
      text-align: center;
    }
    .home-greeting {
      font-family: 'Playfair Display', serif;
      font-size: 2.1rem;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      margin-bottom: 6px;
    }
    .home-date {
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      margin-bottom: 32px;
    }
    .home-score-card {
      background: rgba(8,8,8,0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 24px;
      padding: 32px 24px 28px;
      margin-bottom: 14px;
    }
    .home-score-num {
      font-family: 'Playfair Display', serif;
      font-size: 5rem;
      font-weight: 700;
      line-height: 1;
      color: rgba(255,255,255,0.28);
      transition: color 0.4s;
    }
    .home-score-lbl {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      margin-top: 10px;
    }
    .home-stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
    }
    .home-stat-card {
      flex: 1;
      background: rgba(8,8,8,0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 16px 10px;
    }
    .home-stat-val {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1;
      color: #fff;
    }
    .home-stat-lbl {
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.26);
      margin-top: 6px;
    }
    .home-actions { display: flex; gap: 10px; }
    .home-btn {
      flex: 1;
      font-family: 'Lato', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      padding: 14px 20px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .home-btn-primary { background: rgba(99,102,241,0.85); color: #fff; }
    .home-btn-primary:hover { background: rgb(99,102,241); }
    .home-btn-ghost {
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .home-btn-ghost:hover { background: rgba(255,255,255,0.13); color: rgba(255,255,255,0.9); }

    /* ── Date range bar ──────────────────────────────────────── */
    .range-bar {
      display: flex;
      gap: 6px;
      max-width: 860px;
      margin: 0 auto 16px;
    }
    .range-btn {
      font-family: 'Lato', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 7px 16px;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.1);
      background: transparent;
      color: rgba(255,255,255,0.35);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .range-btn:hover  { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.72); }
    .range-btn.active { background: rgba(255,255,255,0.14); color: rgba(255,255,255,0.95); border-color: rgba(255,255,255,0.28); }

    /* ── Tasks view ──────────────────────────────────────────── */
    .tasks-wrap { max-width: 540px; margin: 0 auto; padding-top: 8px; }
    .tasks-heading {
      font-family: 'Playfair Display', serif;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.26);
      margin-bottom: 18px;
    }
    .task-input-row { display: flex; gap: 10px; margin-bottom: 14px; }
    #task-input {
      flex: 1;
      background: rgba(8,8,8,0.55);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: rgba(255,255,255,0.88);
      font-family: 'Lato', sans-serif;
      font-size: 0.9rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.15s;
    }
    #task-input:focus { border-color: rgba(99,102,241,0.65); }
    #task-input::placeholder { color: rgba(255,255,255,0.18); }
    #task-add-btn {
      font-family: 'Lato', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      background: rgba(99,102,241,0.85);
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    #task-add-btn:hover { background: rgb(99,102,241); }
    .task-list { display: flex; flex-direction: column; gap: 8px; }
    .task-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(8,8,8,0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 14px 16px;
      transition: opacity 0.2s;
    }
    .task-item.done { opacity: 0.42; }
    .task-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.25);
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .task-check.checked { background: #22c55e; border-color: #22c55e; }
    .task-check.checked::after { content: '✓'; color: #fff; font-size: 10px; line-height: 1; }
    .task-text {
      flex: 1;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.85);
      transition: color 0.2s;
      word-break: break-word;
    }
    .task-item.done .task-text { text-decoration: line-through; color: rgba(255,255,255,0.32); }
    .task-del {
      background: none;
      border: none;
      color: rgba(255,255,255,0.16);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 0 2px;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .task-del:hover { color: #ef4444; }
    .task-empty {
      text-align: center;
      color: rgba(255,255,255,0.18);
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      padding: 36px 0;
    }
    .tasks-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding: 0 2px;
    }
    .tasks-count {
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.22);
    }
    .tasks-clear-btn {
      font-family: 'Lato', sans-serif;
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: none;
      border: none;
      color: rgba(255,255,255,0.2);
      cursor: pointer;
      padding: 4px 0;
      transition: color 0.15s;
    }
    .tasks-clear-btn:hover { color: #ef4444; }

    /* ── Timer card hidden by default (shown only on Timer tab) ── */
    #timer-card { display: none; }

    /* ── Home tasks section ─────────────────────────────────────── */
    .home-tasks-section { margin-top: 28px; text-align: left; }
    .home-tasks-label {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.26);
      margin-bottom: 14px;
    }

    /* ── Drag-to-reorder ────────────────────────────────────────── */
    .task-item[draggable="true"] { cursor: grab; }
    .task-item.dragging { opacity: 0.3; border-style: dashed; }
    .task-item.drag-over { border-color: rgba(99,102,241,0.5); background: rgba(99,102,241,0.08); }
    .drag-handle {
      flex-shrink: 0;
      color: rgba(255,255,255,0.15);
      font-size: 15px;
      user-select: none;
      cursor: grab;
    }
  </style>
</head>

  <!-- Home view -->

  <!-- Dashboard view -->

    <div class="range-bar">

      <button class="range-btn"        data-range="week">This Week</button>
      <button class="range-btn"        data-range="month">This Month</button>
    </div>
    <div class="dash-grid">

      <!-- Focus score over time -->
      <div class="dash-card dash-full">
        <p class="dash-title" id="score-chart-title">Focus Score &mdash; Today</p>
        <div class="chart-wrap" style="height:180px">
          <canvas id="chart-score"></canvas>
        </div>
      </div>

      <!-- Time per site -->
      <div class="dash-card">
        <p class="dash-title">Time Per Site</p>
        <div class="chart-wrap" style="height:210px">
          <canvas id="chart-sites"></canvas>
        </div>
      </div>

      <!-- Focus vs distraction -->
      <div class="dash-card">
        <p class="dash-title">Focus vs Distraction</p>
        <div class="stat-row">
          <div class="stat-block">
            <div class="stat-val" id="stat-focus" style="color:#22c55e">--</div>
            <div class="stat-lbl">Focus</div>
          </div>
          <div class="stat-block">
            <div class="stat-val" id="stat-distract" style="color:#f59e0b">--</div>
            <div class="stat-lbl">Distraction</div>
          </div>
          <div class="stat-block">
            <div class="stat-val" id="stat-idle" style="color:rgba(255,255,255,0.38)">--</div>
            <div class="stat-lbl">Idle</div>

      </div>

      <!-- Peak focus hours -->
      <div class="dash-card dash-full">
        <p class="dash-title">Peak Focus Hours</p>
        <div class="chart-wrap" style="height:160px">
          <canvas id="chart-hours"></canvas>
        </div>
      </div>

    </div>
  </div><!-- /#view-dashboard -->

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="timer.js"></script>
  <script>
  (function () {
    // ── State ────────────────────────────────────────────────────
    let currentRange  = 'today';
    let dashRefreshId = null;
    let dragId        = null;

    // ── Panel & nav management ───────────────────────────────────
    const PANELS = {
      home:      document.getElementById('view-home'),
      dashboard: document.getElementById('view-dashboard'),
    };
    const timerCard = document.getElementById('timer-card');

    function switchTo(view) {
      Object.values(PANELS).forEach(p => p.classList.remove('open'));
      stopDashRefresh();
      timerCard.style.display = view === 'timer' ? 'block' : 'none';
      if (view === 'home')      { PANELS.home.classList.add('open');      loadHome(); }
      if (view === 'dashboard') { PANELS.dashboard.classList.add('open'); loadDashboard(); startDashRefresh(); }
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        switchTo(btn.dataset.view);
      });
    });

    // ── Extension data bridge ────────────────────────────────────
    function fetchData() {
      return new Promise(resolve => {
        const t = setTimeout(() => resolve(null), 800);
        const h = e => {
          if (e.data?.type !== 'FOCUSTRACKER_DATA') return;
          window.removeEventListener('message', h);
          clearTimeout(t);
          resolve(e.data.data);
        };
        window.addEventListener('message', h);
        window.postMessage({ type: 'FOCUSTRACKER_REQUEST' }, '*');
      });
    }

    // ── Helpers ──────────────────────────────────────────────────
    const NAMES  = { '127.0.0.1': 'Focus Timer', localhost: 'Focus Timer' };
    const COLORS = ['#6366f1','#22c55e','#f59e0b','#ef4444','#a78bfa','#38bdf8','#fb923c','#34d399'];

    function fmt(s) {
      if (s < 60)   return `${s}s`;
      if (s < 3600) return `${Math.floor(s / 60)}m`;
      return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
    }

    function isApproved(host, list) {
      return (list || []).some(s => host === s || host.endsWith('.' + s));
    }

    function calcScore(tabTime, switchCount, appSites) {
      const entries   = Object.entries(tabTime || {});
      const totalSecs = entries.reduce((a, [, v]) => a + v, 0);
      const totalMins = Math.max(totalSecs / 60, 1);
      const rate      = (switchCount || 0) / totalMins;
      if (!appSites.length) return Math.max(0, Math.round(100 - rate * 50));
      const appSecs   = entries.filter(([h]) => isApproved(h, appSites)).reduce((a, [, v]) => a + v, 0);
      const base      = totalSecs > 0 ? (appSecs / totalSecs) * 100 : 100;
      return Math.max(0, Math.round(base - Math.min(30, rate * 15)));
    }

    // ── Chart.js globals ─────────────────────────────────────────
    Chart.defaults.color       = 'rgba(255,255,255,0.35)';
    Chart.defaults.borderColor = 'rgba(255,255,255,0.06)';
    Chart.defaults.font.family = "'Lato', sans-serif";
    Chart.defaults.font.size   = 11;

    const instances = {};
    function draw(id, cfg) {
      if (instances[id]) instances[id].destroy();
      instances[id] = new Chart(document.getElementById(id), cfg);
    }

    const SCALE_Y = {
      min: 0, max: 100,
      ticks: { stepSize: 25, color: 'rgba(255,255,255,0.3)' },
      grid:  { color: 'rgba(255,255,255,0.05)' },
    };
    const SCALE_X = {
      grid: { display: false },
      ticks: { maxRotation: 0, color: 'rgba(255,255,255,0.3)' },
    };

    // ── Home view ────────────────────────────────────────────────
    async function loadHome() {
      const h = new Date().getHours();
      document.getElementById('home-greeting').textContent =
        h < 12 ? 'Good morning.' : h < 17 ? 'Good afternoon.' : 'Good evening.';
      document.getElementById('home-date').textContent =
        new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });

      const raw      = await fetchData();
      const tabTime  = raw?.tabTime      || {};
      const appSites = raw?.approvedSites || [];
      const entries  = Object.entries(tabTime);
      const hasData  = entries.length > 0 || (raw?.switchCount || 0) > 0;

      const scoreEl = document.getElementById('home-score-num');
      if (!raw || !hasData) {
        scoreEl.textContent = '--';
        scoreEl.style.color = 'rgba(255,255,255,0.28)';
      } else {
        const score = calcScore(tabTime, raw.switchCount, appSites);
        scoreEl.textContent = score;
        scoreEl.style.color =
          score >= 80 ? '#22c55e' : score >= 60 ? '#84cc16' :
          score >= 40 ? '#f59e0b' : '#ef4444';
      }

      let focusSecs = 0, distractSecs = 0;
      for (const [host, secs] of entries) {
        if (isApproved(host, appSites)) focusSecs += secs;
        else distractSecs += secs;
      }
      document.getElementById('home-focus-val').textContent    = focusSecs    ? fmt(focusSecs)    : '--';
      document.getElementById('home-distract-val').textContent = distractSecs ? fmt(distractSecs) : '--';

      renderTasks();
    }

    // ── Dashboard — date range ───────────────────────────────────
    document.querySelectorAll('.range-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentRange = btn.dataset.range;
        loadDashboard();
      });
    });

    function startDashRefresh() {
      stopDashRefresh();
      dashRefreshId = setInterval(loadDashboard, 10000);
    }
    function stopDashRefresh() {
      clearInterval(dashRefreshId);
      dashRefreshId = null;
    }

    const RANGE_MS    = { today: 86400000, week: 7*86400000, month: 30*86400000 };
    const RANGE_LABEL = { today: 'Today',  week: 'This Week', month: 'This Month' };

    async function loadDashboard() {
      const raw       = await fetchData();
      const tabTime   = raw?.tabTime      || {};
      const idleTime  = raw?.idleTime     || 0;
      const appSites  = raw?.approvedSites || [];
      const snapshots = raw?.snapshots    || [];

      const cutoff   = Date.now() - RANGE_MS[currentRange];
      const filtered = snapshots.filter(s => s.ts > cutoff);

      document.getElementById('score-chart-title').textContent =
        `Focus Score — ${RANGE_LABEL[currentRange]}`;

      /* 1 – Focus score over time */
      const labelFn = ts => {
        const d = new Date(ts);
        return currentRange === 'today'
          ? `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`
          : `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}h`;
      };
      draw('chart-score', {
        type: 'line',
        data: {
          labels: filtered.map(s => labelFn(s.ts)),
          datasets: [{
            data: filtered.map(s => s.score),
            borderColor: '#6366f1',
            backgroundColor: 'rgba(99,102,241,0.12)',
            borderWidth: 2,
            pointRadius: filtered.length > 48 ? 0 : 3,
            pointHoverRadius: 5,
            fill: true,
            tension: 0.4,
          }],
        },
        options: {
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: SCALE_Y, x: { ...SCALE_X, ticks: { ...SCALE_X.ticks, maxTicksLimit: 8 } } },
        },
      });

      /* 2 – Time per site */
      const entries = Object.entries(tabTime).sort((a,b) => b[1]-a[1]).slice(0,7);
      draw('chart-sites', {
        type: 'doughnut',
        data: {
          labels: entries.map(([h]) => NAMES[h] || h),
          datasets: [{
            data: entries.map(([,s]) => s),
            backgroundColor: COLORS.slice(0, entries.length),
            borderColor: 'rgba(0,0,0,0.35)',
            borderWidth: 2,
            hoverOffset: 8,
          }],
        },
        options: {
          maintainAspectRatio: false,
          cutout: '60%',
          plugins: {
            legend: { position:'bottom', labels:{ boxWidth:10, padding:12, color:'rgba(255,255,255,0.42)' } },
            tooltip: { callbacks: { label: ctx => ` ${fmt(ctx.raw)}` } },
          },
        },
      });

      /* 3 – Focus vs distraction */
      let focusSecs = 0, distractSecs = 0;
      for (const [h, s] of Object.entries(tabTime)) {
        if (isApproved(h, appSites)) focusSecs += s;
        else distractSecs += s;
      }
      const totalActive = focusSecs + distractSecs;
      document.getElementById('stat-focus').textContent    = totalActive ? fmt(focusSecs)    : '--';
      document.getElementById('stat-distract').textContent = totalActive ? fmt(distractSecs) : '--';
      document.getElementById('stat-idle').textContent     = idleTime    ? fmt(idleTime)     : '--';
      document.getElementById('split-fill').style.width    =
        totalActive ? `${Math.round(focusSecs / totalActive * 100)}%` : '0%';

      draw('chart-split', {
        type: 'doughnut',
        data: {
          labels: ['Focus','Distraction','Idle'],
          datasets: [{
            data: [focusSecs, distractSecs, idleTime],
            backgroundColor: ['#22c55e','#f59e0b','rgba(255,255,255,0.1)'],
            borderColor: 'rgba(0,0,0,0.3)',
            borderWidth: 2,
            hoverOffset: 6,
          }],
        },
        options: {
          maintainAspectRatio: false,
          cutout: '55%',
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: ctx => ` ${fmt(ctx.raw)}` } },
          },
        },
      });

      /* 4 – Peak focus hours (averaged over the selected range) */
      const buckets = Array.from({ length: 24 }, () => ({ sum: 0, n: 0 }));
      for (const s of filtered) {
        const hh = new Date(s.ts).getHours();
        buckets[hh].sum += s.score;
        buckets[hh].n   += 1;
      }
      const avgs = buckets.map(b => b.n ? Math.round(b.sum / b.n) : 0);
      const hlabels = [
        '12a','1a','2a','3a','4a','5a','6a','7a','8a','9a','10a','11a',
        '12p','1p','2p','3p','4p','5p','6p','7p','8p','9p','10p','11p',
      ];
      draw('chart-hours', {
        type: 'bar',
        data: {
          labels: hlabels,
          datasets: [{
            data: avgs,
            backgroundColor: avgs.map(v =>
              v >= 80 ? 'rgba(34,197,94,0.75)'  :
              v >= 60 ? 'rgba(99,102,241,0.75)' :
              v >= 40 ? 'rgba(245,158,11,0.75)' :
              v  > 0  ? 'rgba(239,68,68,0.65)'  :
                        'rgba(255,255,255,0.05)'
            ),
            borderRadius: 4,
            borderSkipped: false,
          }],
        },
        options: {
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: SCALE_Y, x: { ...SCALE_X, ticks: { ...SCALE_X.ticks, font: { size: 10 } } } },
        },
      });
    }

    // ── Tasks ────────────────────────────────────────────────────
    function getTasks() {
      try { return JSON.parse(localStorage.getItem('ft_tasks') || '[]'); } catch { return []; }
    }
    function saveTasks(tasks) { localStorage.setItem('ft_tasks', JSON.stringify(tasks)); }

    function renderTasks() {
      const tasks = getTasks();
      const done  = tasks.filter(t => t.done).length;
      document.getElementById('tasks-count').textContent =
        tasks.length ? `${done} of ${tasks.length} complete` : '';

      const list = document.getElementById('task-list');
      list.innerHTML = '';

      if (!tasks.length) {
        const el = document.createElement('div');
        el.className = 'task-empty';
        el.textContent = 'No tasks yet. Add one above.';
        list.appendChild(el);
        return;
      }

      tasks.forEach(task => {
        const row = document.createElement('div');
        row.className = `task-item${task.done ? ' done' : ''}`;
        row.draggable = true;
        row.dataset.id = task.id;

        row.addEventListener('dragstart', () => {
          dragId = task.id;
          row.classList.add('dragging');
        });
        row.addEventListener('dragend', () => {
          dragId = null;
          row.classList.remove('dragging');
          document.querySelectorAll('.task-item').forEach(r => r.classList.remove('drag-over'));
        });
        row.addEventListener('dragover', e => {
          e.preventDefault();
          if (task.id !== dragId) row.classList.add('drag-over');
        });
        row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
        row.addEventListener('drop', e => {
          e.preventDefault();
          row.classList.remove('drag-over');
          if (dragId === null || dragId === task.id) return;
          const all = getTasks();
          const fromIdx = all.findIndex(x => x.id === dragId);
          const toIdx   = all.findIndex(x => x.id === task.id);
          if (fromIdx === -1 || toIdx === -1) return;
          const [moved] = all.splice(fromIdx, 1);
          all.splice(toIdx, 0, moved);
          saveTasks(all);
          renderTasks();
        });

        const handle = document.createElement('span');
        handle.className   = 'drag-handle';
        handle.textContent = '⋮⋮';

        const check = document.createElement('div');
        check.className = `task-check${task.done ? ' checked' : ''}`;
        check.addEventListener('click', () => {
          const all = getTasks();
          const t   = all.find(x => x.id === task.id);
          if (t) { t.done = !t.done; saveTasks(all); renderTasks(); }
        });

        const text = document.createElement('span');
        text.className   = 'task-text';
        text.textContent = task.text;

        const del = document.createElement('button');
        del.className   = 'task-del';
        del.textContent = '×';
        del.title       = 'Delete';
        del.addEventListener('click', () => {
          saveTasks(getTasks().filter(x => x.id !== task.id));
          renderTasks();
        });

        row.appendChild(handle);
        row.appendChild(check);
        row.appendChild(text);
        row.appendChild(del);
        list.appendChild(row);
      });
    }

    function addTask() {
      const input = document.getElementById('task-input');
      const text  = input.value.trim();
      if (!text) return;
      const tasks = getTasks();
      tasks.unshift({ id: Date.now(), text, done: false });
      saveTasks(tasks);
      renderTasks();
      input.value = '';
    }

    document.getElementById('task-add-btn').addEventListener('click', addTask);
    document.getElementById('task-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });
    document.getElementById('tasks-clear-btn').addEventListener('click', () => {
      saveTasks(getTasks().filter(t => !t.done));
      renderTasks();
    });

    // ── Init ─────────────────────────────────────────────────────
    loadHome();
  })();
  </script>
</body>
</html>
